      summary: Initialize a T-Bank payment for an order
      description: '`idempotency_key` identifies one frontend payment attempt. A network retry with

        the same key returns the same payment and must not create another provider payment.

        '
      x-status: planned
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTBankPaymentRequest'
      responses:
        '200':
          description: Existing payment returned for the same idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '201':
          description: Payment initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/orders/{order_id}/payment:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      tags:
      - payments
      operationId: getOrderPayment
      summary: Get the current payment for an order
      description: The backend may reconcile a pending local payment with T-Bank before responding.
      x-status: planned
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current payment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/orders/{order_id}/payment/cancel:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - payments
      operationId: cancelOrderPayment
      summary: Cancel an unpaid payment
      x-status: planned
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cancelled payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/payments/tbank/webhook:
    post:
      tags:
      - provider-webhooks
      operationId: receiveTBankWebhook
      summary: Receive and verify a T-Bank payment notification
      description: Provider-only operation. Browser clients must never call it.
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider-specific payload validated against the T-Bank contract by backend.
      responses:
        '200':
          description: Notification accepted, including an already processed notification
          content:
            text/plain:
              schema:
                type: string
                const: OK
              example: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid provider signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
